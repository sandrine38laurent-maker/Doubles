<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dobble - RC Domène Handball</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #003366; }
    #stats {
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .game-board {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .card {
      width: 250px;
      height: 250px;
      background: white;
      border-radius: 50%;
      border: 6px solid #003366;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .symbol {
      position: absolute;
      font-size: 2.5rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }
    .symbol:hover {
      transform: scale(1.2);
    }
    /* Modal de Victoire */
    #win-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #d90429;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>🤾 Dobble RC Domène Handball</h1>
  <p>Trouve le symbole identique entre les deux cartes le plus vite possible !</p>
  
  <div id="stats">
    Score : <span id="score">0</span> / 5 | Temps : <span id="timer">0</span>s
  </div>

  <div class="game-board">
    <div class="card" id="card1"></div>
    <div class="card" id="card2"></div>
  </div>

  <!-- Ecran de Victoire -->
  <div id="win-modal">
    <div class="modal-content">
      <h2>🎉 Bravo !</h2>
      <p>Tu as trouvé tous les symboles en <span id="final-time"></span> secondes !</p>
      <p>Rejoins-nous sur le terrain ou découvre les actualités du club :</p>
      <a href="https://www.rcdomenehandball.fr" target="_blank" class="btn">Visiter le site du RC Domène</a>
    </div>
  </div>

  <script>
    // Vous pouvez remplacer les emojis par des URLs d'images (ex: 'logo.png', 'maillot.png')
    const SYMBOLS = ['🤾', '🤾‍♀️', '🏆', '🥇', '👟', '🥅', '⏱️', '📢'];
    
    let score = 0;
    const targetScore = 5;
    let timer = 0;
    let timerInterval;
    let commonSymbol = "";

    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        document.getElementById('timer').innerText = timer;
      }, 1000);
    }

    function getRandomRotation() {
      return Math.floor(Math.random() * 360);
    }

    function generateRound() {
      const card1El = document.getElementById('card1');
      const card2El = document.getElementById('card2');
      card1El.innerHTML = '';
      card2El.innerHTML = '';

      // Choisir 1 symbole commun
      const shuffled = [...SYMBOLS].sort(() => 0.5 - Math.random());
      commonSymbol = shuffled[0];

      // Cartes avec 3 symboles chacune
      let card1Symbols = [commonSymbol, shuffled[1], shuffled[2]].sort(() => 0.5 - Math.random());
      let card2Symbols = [commonSymbol, shuffled[3], shuffled[4]].sort(() => 0.5 - Math.random());

      // Positions prédéfinies sur le disque (en px relatifs)
      const positions = [
        { top: '25%', left: '30%' },
        { top: '60%', left: '20%' },
        { top: '45%', left: '60%' }
      ];

      function renderCard(cardEl, symbols) {
        symbols.forEach((sym, index) => {
          const el = document.createElement('div');
          el.className = 'symbol';
          el.innerText = sym;
          el.style.top = positions[index].top;
          el.style.left = positions[index].left;
          el.style.transform = `rotate(${getRandomRotation()}deg)`;
          
          el.onclick = () => checkMatch(sym);
          cardEl.appendChild(el);
        });
      }

      renderCard(card1El, card1Symbols);
      renderCard(card2El, card2Symbols);
    }

    function checkMatch(selectedSymbol) {
      if (selectedSymbol === commonSymbol) {
        score++;
        document.getElementById('score').innerText = score;
        if (score >= targetScore) {
          clearInterval(timerInterval);
          document.getElementById('final-time').innerText = timer;
          document.getElementById('win-modal').style.display = 'flex';
        } else {
          generateRound();
        }
      }
    }

    // Démarrage du jeu
    startTimer();
    generateRound();
  </script>
</body>
</html>
